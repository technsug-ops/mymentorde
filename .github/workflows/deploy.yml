name: Deploy to KASSERVER (my.mentorde.com)

# Her main branch push'unda otomatik tetiklenir
# Manuel tetikleme için: GitHub > Actions > Deploy > "Run workflow"
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Tüm adımları zorla çalıştır (composer + npm + Vite + transfer-all)'
        required: false
        default: 'false'

# Yığılmayı önle: yeni push gelirse koşan/bekleyen eski run iptal edilsin.
# KASSERVER tek FTP target — paralel deploy race condition yaratır.
concurrency:
  group: deploy-kasserver-prod
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and FTP Deploy
    runs-on: ubuntu-latest
    # Takılı kalan FTP transferleri 6 saat boyunca tutmaktansa 20 dk'da fail et.
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # paths-filter önceki commit'le diff yapar — fetch-depth: 2 gerekli
          fetch-depth: 2

      # Hangi path'lerde değişiklik oldu? Conditional step'ler buna göre çalışır.
      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            composer:
              - 'composer.json'
              - 'composer.lock'
            frontend:
              - 'resources/js/**'
              - 'resources/css/**'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.js'
              - 'postcss.config.js'
              - 'tailwind.config.js'

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, gd, fileinfo, zip, curl, openssl, bcmath
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php8.4-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php8.4-composer-

      - name: Install Composer dependencies (production)
        # Sadece composer.lock değişti VEYA cache miss olunca çalıştır
        if: steps.composer-cache.outputs.cache-hit != 'true' || steps.changes.outputs.composer == 'true' || inputs.force_rebuild == 'true'
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Regenerate Composer autoload classmap
        # composer.lock değişmese de yeni PHP class dosyaları classmap'e
        # girmesi için her deploy'da autoload regenerate. Hızlı (~1-2 sn).
        # Sebep: app/Models/X.php yeni eklendiğinde "Class not found" hatası
        # vendor/composer cache'lenmiş classmap'ten kaynaklanır.
        run: composer dump-autoload --optimize --no-dev

      - name: Setup Node 20
        # Sadece frontend değişti veya manual force
        if: steps.changes.outputs.frontend == 'true' || inputs.force_rebuild == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM dependencies
        if: steps.changes.outputs.frontend == 'true' || inputs.force_rebuild == 'true'
        run: npm ci

      - name: Build Vite assets
        if: steps.changes.outputs.frontend == 'true' || inputs.force_rebuild == 'true'
        run: npm run build

      - name: Install lftp
        run: sudo apt-get install -y lftp

      # ── Maintenance mode ON (FTP race window'unda 500 yerine 503) ────────
      # storage/framework/maintenance.php var iken Laravel her isteği 503 döner.
      # Mirror bittikten sonra siliyoruz; aradaki ~30-60 sn pencerede gelen
      # request'ler "Class not found" / "Failed to open stream" yerine retry'lı
      # 503 alır.
      - name: Maintenance mode ON
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          cat > /tmp/maintenance.php <<'EOF'
          <?php return [
              // _deploy/* maintenance icinde de erisilebilir — admin stuck-503'ten
              // cikis icin /_deploy/run-pending?cleanup=clear-maintenance cagirabilir
              'except'   => ['_deploy/*'],
              'redirect' => null,
              'retry'    => 30,
              'refresh'  => 30,
              'secret'   => null,
              'status'   => 503,
              'template' => null,
          ];
          EOF
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_HOST" -e "
            set ftp:ssl-force yes
            set ssl:verify-certificate no
            set ftp:passive-mode true
            set cmd:fail-exit yes
            cd '$FTP_SERVER_DIR/storage/framework'
            put /tmp/maintenance.php
            bye
          " || echo "::warning::Maintenance ON failed — continuing with deploy"

      - name: Deploy via lftp (FTPS)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          # Vite build çalışmadıysa public/build upload adımını atla
          SKIP_BUILD_UPLOAD: ${{ (steps.changes.outputs.frontend != 'true' && inputs.force_rebuild != 'true') && 'true' || 'false' }}
          # force_rebuild=true → lftp --transfer-all ile her dosyayi zorla upload
          # (KAS partial transfer / mtime mismatch fix'i icin)
          FORCE_REBUILD: ${{ inputs.force_rebuild == 'true' && 'true' || 'false' }}
          # Telemetri: hangi step'ler skip edildi log'da görünsün
          CHANGED_COMPOSER: ${{ steps.changes.outputs.composer }}
          CHANGED_FRONTEND: ${{ steps.changes.outputs.frontend }}
        run: python3 scripts/lftp-deploy.py

      # ── Maintenance mode OFF — KRİTİK: deploy başarısız bile olsa çalışmalı
      # Aksi halde site 503'te takılır. if: always() garanti eder.
      - name: Maintenance mode OFF
        if: always()
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_HOST" -e "
            set ftp:ssl-force yes
            set ssl:verify-certificate no
            set ftp:passive-mode true
            cd '$FTP_SERVER_DIR/storage/framework'
            rm -f maintenance.php
            bye
          " || echo "::warning::Maintenance OFF failed — site may be stuck in 503 mode!"

      - name: Deploy summary
        if: always()
        run: |
          echo "### 🚀 Deploy özeti" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Adım | Durum |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Composer install | ${{ (steps.composer-cache.outputs.cache-hit != 'true' || steps.changes.outputs.composer == 'true') && '✅ Çalıştı' || '⏭️ Skip (değişiklik yok)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm + Vite build | ${{ steps.changes.outputs.frontend == 'true' && '✅ Çalıştı' || '⏭️ Skip (frontend değişmedi)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| FTP deploy | ✅ Çalıştı |" >> $GITHUB_STEP_SUMMARY
